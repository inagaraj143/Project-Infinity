name: EOD snapshots

# Builds the JSON snapshots the hosted Streamlit app reads, so the app never
# calls a market API while the market is closed.
#
# Cron is UTC. 10:15 UTC = 15:45 IST, fifteen minutes after the 15:30 close --
# GitHub's scheduler routinely runs 5-20 minutes late under load, so do not
# tighten this to 15:31 IST.
#
# NOTE: scheduled workflows are auto-disabled after 60 days of repo inactivity.
# The daily snapshot commit below keeps the repo active, which keeps the cron
# alive. If you stop committing, re-enable it in the Actions tab.

on:
  schedule:
    - cron: "15 10 * * 1-5"
  workflow_dispatch:
    inputs:
      universe:
        description: "Universe to build"
        type: choice
        options: [nifty50, nifty500]
        default: nifty500
      refresh_universe:
        description: "Refetch index constituents from NSE"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: eod-snapshots
  cancel-in-progress: false

env:
  UNIVERSE: ${{ inputs.universe || 'nifty500' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Skip on NSE holidays
        id: gate
        run: |
          python - <<'PY'
          import os
          from infinity.market_clock import is_trading_day, now_ist
          today = now_ist().date()
          trading = is_trading_day(today)
          print(f"{today} trading day: {trading}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"run={'true' if trading else 'false'}\n")
          PY

      # Bulk OHLC is gitignored, so without this cache every run refetches
      # 12 years of bars for the whole universe. The key rolls daily; the
      # restore-key lets today's run start from yesterday's bars and top up.
      - name: Restore OHLC cache
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            data/ohlc
            data/instruments
          key: ohlc-${{ env.UNIVERSE }}-${{ github.run_id }}
          restore-keys: |
            ohlc-${{ env.UNIVERSE }}-

      - name: Refresh instrument master and universes
        if: steps.gate.outputs.run == 'true'
        env:
          CI: "true"
        run: |
          python scripts/refresh_reference.py \
            --universe "$UNIVERSE" \
            ${{ inputs.refresh_universe && '--force' || '' }}

      - name: Build snapshots
        if: steps.gate.outputs.run == 'true'
        env:
          # No token needed: Upstox candle endpoints are unauthenticated
          # (ADR 0002), so CI uses the official feed with yfinance as fallback.
          CI: "true"
        run: |
          python scripts/build_snapshots.py \
            --universe "$UNIVERSE" \
            --workers 6 \
            --rate 8 \
            --max-failure-pct 15

      - name: Commit snapshots
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name  "infinity-bot"
          git config user.email "infinity-bot@users.noreply.github.com"
          git add -A data/snapshots data/universes
          if git diff --staged --quiet; then
            echo "no snapshot changes"
          else
            git commit -m "chore(data): EOD snapshots $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Upload run metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eod-meta
          path: data/snapshots/
          retention-days: 14
          if-no-files-found: ignore
